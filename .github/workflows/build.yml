name: Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "*/go.*"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: 🔎 Reuse check
      run: |
        docker run --rm --volume $PWD:/data fsfe/reuse:5.1 lint
  sdk:
    runs-on: [self-hosted, linux]
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.27'
    - name: 🔧 Update go.mod for testing
      run: echo "replace github.com/outscale/goutils/sdk => ../sdk" >> k8s/go.mod
    - name: 🔎 golangci-lint
      uses: ./.github/actions/lint
      with:
        working-directory: sdk
    - name: 🧪 Unit tests
      run: cd sdk && go test ./...
  k8s:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.27'
    - name: 🔎 golangci-lint
      uses: ./.github/actions/lint
      with:
        working-directory: k8s
    - name: 🧪 Unit tests
      run: cd k8s && go test ./...
  oks:
    runs-on: ubuntu-latest
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.27'
    - name: 🔎 golangci-lint
      uses: ./.github/actions/lint
      with:
        working-directory: oks
