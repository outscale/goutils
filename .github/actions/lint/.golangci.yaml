version: "2"
run:
  timeout: 5m

formatters:
  enable:
    - gofumpt

output:
  sort-order:
    - file
    - linter
    - severity

issues:
  uniq-by-line: false
  max-same-issues: 10

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - dogsled
    - errcheck
    - errname
    - errorlint
    - exptostd
    - ginkgolinter
    - gocritic
    - gosec
    - govet
    - importas
    - ineffassign
      #- lll
    - loggercheck
    - misspell
    - modernize
    - musttag
    # - nakedret
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - promlinter
    - protogetter
    # - revive
    - staticcheck
    - testifylint
    - testpackage
    - thelper
    - unused
    - usetesting
    - whitespace
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - dogsled
          - musttag
          - perfsprint
          - prealloc
          - protogetter
  settings:
    lll:
      line-length: 160
    usetesting:
      context-background: true
      context-todo: true
      os-temp-dir: true
    importas:
      # Do not allow unaliased imports of aliased packages.
      no-unaliased: true
      alias:
        # Kubernetes aliases
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/api/apps/v1
          alias: appsv1
        - pkg: k8s.io/api/storage/v1
          alias: storagev1
        - pkg: k8s.io/api/rbac/v1
          alias: rbacv1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: github.com/kubernetes-csi/external-snapshotter/client/v8/apis/volumesnapshot/v1
          alias: volumesnapshotv1
